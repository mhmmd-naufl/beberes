name: exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # upload asset ke GitHub Release saat tag

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang dependensi build
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build beberes-ui.exe
        run: >
          pyinstaller --onefile --name beberes-ui --console
          --add-data "src/beberes/ui;beberes/ui"
          --add-data "src/beberes/data;beberes/data"
          scripts/beberes_ui.py

      - name: Upload ke GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/beberes-ui.exe
          fail_on_unmatched_files: true

      - name: Upload artifact (build manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: beberes-ui-windows
          path: dist/beberes-ui.exe
          retention-days: 7
