name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  rilis:
    runs-on: ubuntu-latest
    environment: pypi   # wajib ada environment 'pypi' di repo settings
    permissions:
      id-token: write   # untuk trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tes
        run: |
          pip install -e ".[dev]"
          pytest -q
          ruff check src tests

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Upload ke PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
