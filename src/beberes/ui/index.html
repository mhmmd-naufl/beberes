<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beberes: rapikan spreadsheet</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<style>
  /* Tema tetap terang: alat utilitas lokal yang hasilnya sering dibagikan
     atau dicetak; toggle dark-mode sengaja tidak dibuat (keputusan R-21,
     lihat anti-slop/audit-001-2026-11-26.md). */
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #1c2430; }
  h1 { font-size: 1.6rem; margin-bottom: .25rem; }
  .kartu { border: 1px solid #d5dbe3; border-radius: 10px; padding: 1rem; margin: 1rem 0; }
  .label { display: block; font-weight: 600; margin: .75rem 0 .25rem; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  th, td { border: 1px solid #e2e8f0; padding: .3rem .5rem; text-align: left; }
  th { background: #f1f5f9; }
  .error { color: #b91c1c; } .peringatan { color: #b45309; } .info { color: #1d4ed8; }
  button, summary, label { cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible, a:focus-visible, input:focus-visible,
  textarea:focus-visible, summary:focus-visible {
    outline: 2px solid #0f766e; outline-offset: 2px;
  }
  button { background: #0f766e; color: #fff; border: 0; border-radius: 8px; padding: .6rem 1.2rem; font-size: 1rem; }
  button.kecil { background: #e2e8f0; color: #1c2430; padding: 0 .9rem; min-height: 44px; font-size: .8rem; }
  button.bahasa { background: #e2e8f0; color: #1c2430; padding: 0 .7rem; min-height: 32px; font-size: .8rem; }
  button.bahasa.aktif { background: #0f766e; color: #fff; }
  .aksi-grup { margin: .35rem 0 .25rem; }
  .gulung, .scroll { overflow: auto; }
  .scroll { max-height: 320px; }
  textarea { width: 100%; font-family: monospace; font-size: .8rem; box-sizing: border-box; }
  .muted { color: #64748b; font-size: .85rem; }
  input[type="file"] { max-width: 100%; }
  .bar-bahasa { float: right; }
</style>
</head>
<body>
<header>
  <div class="bar-bahasa">
    <button type="button" class="bahasa" id="btnID" onclick="setBahasa('id')">ID</button>
    <button type="button" class="bahasa" id="btnEN" onclick="setBahasa('en')">EN</button>
  </div>
  <h1 data-i18n="judul">beberes</h1>
  <p class="muted" data-i18n="subjudul">Periksa file Excel/CSV berantakan. File tidak diubah sampai kamu pilih bersihkan.</p>
</header>

<main>
<div class="kartu">
  <label class="label" for="file" data-i18n="label_berkas">Berkas Excel/CSV</label>
  <input type="file" id="file" accept=".xlsx,.xlsm,.xls,.csv">
  <label class="label" for="aturan" data-i18n="label_aturan">Aturan YAML opsional</label>
  <p class="muted" data-i18n="aturan_hint">Kosongkan untuk pemeriksaan umum.</p>
  <textarea id="aturan" rows="4" data-i18n-ph="placeholder_aturan" placeholder="versi: 1&#10;kolom:&#10;  No HP:&#10;    tipe: hp"></textarea>
  <p>
    <button type="button" onclick="periksa()" data-i18n="btn_periksa">Periksa</button>
    <button type="button" onclick="bersihkan()" id="btnBersih" disabled data-i18n="btn_bersih">Bersihkan &amp; unduh</button>
  </p>
</div>

<div id="hasil" aria-live="polite"></div>
</main>

<script>
const $ = id => document.getElementById(id);

/* ---- i18n: semua teks user lewat t() (aturan proyek #5) ---- */
const I18N = {
id: {
  judul: "beberes", subjudul: "Periksa file Excel/CSV berantakan. File tidak diubah sampai kamu pilih bersihkan.",
  label_berkas: "Berkas Excel/CSV", label_aturan: "Aturan YAML opsional",
  aturan_hint: "Kosongkan untuk pemeriksaan umum.",
  btn_periksa: "Periksa", btn_bersih: "Bersihkan & unduh", btn_urungkan: "Urungkan perubahan",
  placeholder_aturan: "versi: 1\nkolom:\n  No HP:\n    tipe: hp",
  hasil_kosong: "Belum ada hasil. Pilih berkas lalu tekan Periksa.",
  memeriksa: "memeriksa…", membersihkan: "membersihkan…", mengurungkan: "mengurungkan…",
  pilih_berkas: "Pilih berkas dulu.", berkas_label: "Berkas:",
  semua: "semua", kosongkan: "kosongkan",
  grup_ringkas: "Perbaikan per grup ({n})", perlu_konfirmasi: "(perlu konfirmasi)",
  sheet_judul: "Sheet '{sheet}': {baris} baris, {kolom} kolom, skor {skor}, {temuan} temuan, {perbaikan} perbaikan ({konfirmasi} butuh konfirmasi)",
  th_kode: "Kode", th_kolom: "Kolom", th_tingkat: "Tingkat", th_pesan: "Pesan", th_contoh: "Contoh",
  tidak_ada_masalah: "✓ tidak ada masalah",
  sukses_bersih: "✓ {n} perubahan diterapkan:", unduh_bersih: "unduh file bersih",
  unduh_audit: "unduh audit log", audit_ringkas: "audit log ({n} baris)",
  th_sheet: "Sheet", th_sel: "Sel", th_perubahan: "Perubahan",
  audit_lagi: "…dan {n} baris lagi (lihat file audit)",
  sukses_urung: "✓ {n} baris audit dipulihkan:", unduh_urung: "unduh file semula",
},
en: {
  judul: "beberes", subjudul: "Check messy Excel/CSV files. Nothing changes until you choose to clean.",
  label_berkas: "Excel/CSV file", label_aturan: "Optional YAML rules",
  aturan_hint: "Leave empty for a general check.",
  btn_periksa: "Check", btn_bersih: "Clean & download", btn_urungkan: "Undo changes",
  placeholder_aturan: "versi: 1\nkolom:\n  No HP:\n    tipe: hp",
  hasil_kosong: "No results yet. Pick a file and press Check.",
  memeriksa: "checking…", membersihkan: "cleaning…", mengurungkan: "undoing…",
  pilih_berkas: "Pick a file first.", berkas_label: "File:",
  semua: "all", kosongkan: "none",
  grup_ringkas: "Fixes by group ({n})", perlu_konfirmasi: "(needs confirmation)",
  sheet_judul: "Sheet '{sheet}': {baris} rows, {kolom} cols, score {skor}, {temuan} findings, {perbaikan} fixes ({konfirmasi} need confirmation)",
  th_kode: "Code", th_kolom: "Column", th_tingkat: "Level", th_pesan: "Message", th_contoh: "Examples",
  tidak_ada_masalah: "✓ no problems",
  sukses_bersih: "✓ {n} changes applied:", unduh_bersih: "download cleaned file",
  unduh_audit: "download audit log", audit_ringkas: "audit log ({n} rows)",
  th_sheet: "Sheet", th_sel: "Cell", th_perubahan: "Change",
  audit_lagi: "…and {n} more rows (see audit file)",
  sukses_urung: "✓ {n} audit rows restored:", unduh_urung: "download restored file",
},
};
let bahasa = localStorage.getItem("beberes_bahasa") || "id";
function t(k, v) {
  let s = (I18N[bahasa] && I18N[bahasa][k]) || I18N.id[k] || k;
  if (v) for (const a in v) s = s.split("{" + a + "}").join(String(v[a]));
  return s;
}
function setBahasa(b) {
  bahasa = b;
  localStorage.setItem("beberes_bahasa", b);
  document.documentElement.lang = b;
  document.title = b === "id" ? "beberes: rapikan spreadsheet" : "beberes: tidy up spreadsheets";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $("btnID").classList.toggle("aktif", b === "id");
  $("btnEN").classList.toggle("aktif", b === "en");
  renderHasil();
}

/* ---- state & render ---- */
let state = { lembar: null, berkas: "", bersih: null, sibuk: "", error: null };
let centang = new Set();  // "i|kunci" grup yang aktif
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function renderGrup(l, i) {
  if (!l.grup || !l.grup.length) return "";
  const baris = l.grup.map(g => {
    const id = `${i}|${g.kunci}`;
    const contoh = (g.contoh || []).map(c => `${esc(c.lama)} → ${esc(c.baru)}`).join("; ");
    return `<label style="display:block;margin:.25rem 0">
      <input type="checkbox" data-kunci="${esc(id)}" ${centang.has(id) ? "checked" : ""} onchange="ubahCentang(this)">
      <b>${esc(g.kode)}</b> ${esc(g.kolom)}: ${g.jumlah} sel${g.aman ? "" : ` <span class="peringatan">${esc(t("perlu_konfirmasi"))}</span>`}
      <span class="muted">${contoh}</span>
    </label>`;
  }).join("");
  return `<details><summary>${esc(t("grup_ringkas", { n: l.grup.length }))}</summary>
    <div class="aksi-grup">
      <button type="button" class="kecil" onclick="toggleGrup(this,true)">${esc(t("semua"))}</button>
      <button type="button" class="kecil" onclick="toggleGrup(this,false)">${esc(t("kosongkan"))}</button>
    </div>${baris}</details>`;
}

function ubahCentang(cb) {
  const id = cb.dataset.kunci;
  if (cb.checked) centang.add(id); else centang.delete(id);
}

function toggleGrup(btn, nilai) {
  btn.closest(".kartu").querySelectorAll("input[data-kunci]")
    .forEach(cb => { cb.checked = nilai; ubahCentang(cb); });
}

function kartuLembar(l, i) {
  const judul = esc(t("sheet_judul", {
    sheet: l.sheet, baris: l.baris, kolom: l.kolom, skor: l.skor,
    temuan: l.temuan.length, perbaikan: l.perbaikan, konfirmasi: l.konfirmasi,
  }));
  const tabel = l.temuan.length
    ? `<div class="gulung"><table><tr><th>${esc(t("th_kode"))}</th><th>${esc(t("th_kolom"))}</th><th>${esc(t("th_tingkat"))}</th><th>${esc(t("th_pesan"))}</th><th>${esc(t("th_contoh"))}</th></tr>` +
      l.temuan.map(x => `<tr class="${esc(x.tingkat)}"><td>${esc(x.kode)}</td><td>${esc(x.kolom)}</td><td>${esc(x.tingkat)}</td><td>${esc(x.pesan)}</td><td>${esc((x.contoh||[]).join("; "))}</td></tr>`).join("") + `</table></div>`
    : `<p>${esc(t("tidak_ada_masalah"))}</p>`;
  return `<div class="kartu">
    <b>${judul}</b>
    ${renderGrup(l, i)}
    ${tabel}
  </div>`;
}

function kartuBersih() {
  const b = state.bersih;
  if (!b) return "";
  const MAKS = 200;
  const isiAudit = b.auditRows.slice(0, MAKS).map(p =>
    `<tr><td>${esc(p.sheet)}</td><td>${esc(p.sel)}</td><td>${esc(p.kolom)}</td>
     <td>${esc(p.kode)}</td><td>${esc(p.nilai_lama)} → ${esc(p.nilai_baru)}</td></tr>`
  ).join("");
  return `<div class="kartu">
    <p>${esc(t("sukses_bersih", { n: b.perubahan }))}
      <a href="${esc(b.unduh)}">${esc(t("unduh_bersih"))}</a> ·
      <a href="${esc(b.auditUrl)}">${esc(t("unduh_audit"))}</a><br>
      <button type="button" class="kecil" id="btnUrung" onclick="urungkan()" ${state.sibuk ? "disabled" : ""}>${esc(t("btn_urungkan"))}</button></p>
    ${b.hasilUrung ? `<p>${esc(t("sukses_urung", { n: b.auditRows.length }))} <a href="${esc(b.hasilUrung)}">${esc(t("unduh_urung"))}</a></p>` : ""}
    <details><summary>${esc(t("audit_ringkas", { n: b.perubahan }))}</summary>
    <div class="scroll"><table><tr><th>${esc(t("th_sheet"))}</th><th>${esc(t("th_sel"))}</th><th>${esc(t("th_kolom"))}</th><th>${esc(t("th_kode"))}</th><th>${esc(t("th_perubahan"))}</th></tr>${isiAudit}</table>
    ${b.auditRows.length > MAKS ? `<p class="muted">${esc(t("audit_lagi", { n: b.auditRows.length - MAKS }))}</p>` : ""}</div></details>
  </div>`;
}

function renderHasil() {
  const el = $("hasil");
  if (state.sibuk) { el.innerHTML = `<p>${esc(state.sibuk)}</p>`; return; }
  if (!state.lembar) {
    el.innerHTML = state.error
      ? `<p class="error">${esc(state.error)}</p>`
      : `<p class="muted">${esc(t("hasil_kosong"))}</p>`;
    return;
  }
  el.innerHTML = (state.error ? `<p class="error">${esc(state.error)}</p>` : "") +
    `<p class="muted">${esc(t("berkas_label"))} ${esc(state.berkas)}</p>` +
    state.lembar.map((l, i) => kartuLembar(l, i)).join("") + kartuBersih();
}

/* ---- aksi ---- */
function formData() {
  const fd = new FormData();
  fd.append("file", $("file").files[0]);
  const at = $("aturan").value.trim();
  if (at) fd.append("aturan", at);
  return fd;
}

async function kirim(endpoint, fd) {
  const r = await fetch(endpoint, { method: "POST", body: fd || formData() });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function periksa() {
  if (!$("file").files.length) { state.error = t("pilih_berkas"); renderHasil(); return; }
  state = { lembar: null, berkas: $("file").files[0].name, bersih: null, sibuk: t("memeriksa"), error: null };
  centang = new Set();
  $("btnBersih").disabled = true;
  renderHasil();
  try {
    const data = await kirim("/api/periksa");
    state.lembar = data.lembar;
    state.sibuk = "";
    centang = new Set();  // default: semua grup aman tercentang
    data.lembar.forEach((l, i) => (l.grup || []).forEach(g => {
      if (g.aman) centang.add(`${i}|${g.kunci}`);
    }));
    $("btnBersih").disabled = false;
    renderHasil();
  } catch (e) { state.sibuk = ""; state.error = e.message; renderHasil(); }
}

async function bersihkan() {
  $("btnBersih").disabled = true;
  state.error = null;
  state.sibuk = t("membersihkan");
  renderHasil();
  try {
    const fd = formData();
    const aktif = [...document.querySelectorAll("input[data-kunci]:checked")]
      .map(cb => cb.dataset.kunci);
    fd.append("grup_aktif", JSON.stringify(aktif));
    const data = await kirim("/api/bersihkan", fd);
    state.sibuk = "";
    state.bersih = {
      perubahan: data.perubahan, unduh: data.unduh, auditUrl: data.audit_url,
      auditRows: (data.audit || "").split("\n").filter(Boolean)
        .map(l => { try { return JSON.parse(l); } catch { return null; } })
        .filter(Boolean),
      namaBersih: data.unduh.split("/").pop(), namaAudit: data.audit_url.split("/").pop(),
    };
    renderHasil();
  } catch (e) { state.sibuk = ""; state.error = e.message; renderHasil(); }
  $("btnBersih").disabled = false;
}

async function urungkan() {
  state.sibuk = t("mengurungkan");
  renderHasil();
  try {
    const fd = new FormData();
    fd.append("berkas", state.bersih.namaBersih);
    fd.append("audit", state.bersih.namaAudit);
    const data = await kirim("/api/urungkan", fd);
    state.sibuk = "";
    state.bersih.hasilUrung = data.unduh;
    renderHasil();
  } catch (e) { state.sibuk = ""; state.error = e.message; renderHasil(); }
}

setBahasa(bahasa);
</script>
</body>
</html>
