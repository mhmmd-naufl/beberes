# Template aturan: data peserta lomba/organisasi
# Pakai: beberes bersihkan data.xlsx --aturan peserta.yaml
# Nama kunci = nama kolom di file (pencocokan tidak case-sensitive).
versi: 1
nama: peserta
kolom:
  Nama:
    tipe: nama
  "No HP":
    tipe: hp
  Wilayah:
    tipe: wilayah
  Tanggal Lahir:
    tipe: tanggal
  Pekerjaan:
    tipe: teks
